[project]
name = "team-5-table-plot-agent"
version = "0.1.0"
description = "Extracts and publishes a table that can be plotted."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[dependency-groups]
# Local development tools. Docker builds use --no-dev, so this group never
# reaches the container. prometheus_api itself is NOT listed here: install it
# to match the platform's base image (see README "Run locally").
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
# Async tests do not need @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
